version: '3.8'

services:
  # Backend API (connects to Supabase)
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: cloudcanvas-backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: your_super_secret_jwt_key_change_this_in_production
      JWT_EXPIRE: 7d
      JWT_REFRESH_SECRET: your_super_secret_refresh_key_change_this_in_production
      JWT_REFRESH_EXPIRE: 30d
      FRONTEND_URL: http://localhost:5173
      LOG_LEVEL: debug
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
    command: npm run dev

  # Frontend
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: cloudcanvas-frontend
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./Frontend/src:/app/src
    networks:
      - cloudcanvas-network
    command: npm run dev

volumes:
  postgres_data:

